name: Setup PR Status Labels

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/setup_labels.sh'
      - '.github/workflows/labels.yml'

jobs:
  setup-labels:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      repository-projects: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Label Setup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/setup_labels.sh
